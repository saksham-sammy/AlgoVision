<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoVision - DSA Execution Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-8 flex flex-col items-center">
    
    <header class="w-full max-w-4xl mb-8 text-center">
        <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">AlgoVision</h1>
        <p class="text-slate-400">Advanced Data Structures & Algorithms Execution Engine</p>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Controls Panel -->
        <section class="glass-panel rounded-2xl p-6 col-span-1 flex flex-col gap-4 shadow-xl">
            <h2 class="text-xl font-semibold mb-2">Configuration</h2>
            
            <div class="flex flex-col gap-1">
                <label class="text-sm text-slate-400">Select Algorithm</label>
                <select id="algoSelect" class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
                    <optgroup label="Sorting">
                        <option value="bubbleSort">Bubble Sort</option>
                        <option value="quickSort">Quick Sort</option>
                        <option value="mergeSort">Merge Sort</option>
                    </optgroup>
                    <optgroup label="Searching">
                        <option value="binarySearch">Binary Search</option>
                        <option value="linearSearch">Linear Search</option>
                    </optgroup>
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm text-slate-400">Input Array (comma separated)</label>
                <textarea id="inputArray" rows="3" class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 font-mono resize-none">64, 34, 25, 12, 22, 11, 90</textarea>
            </div>

            <div class="flex flex-col gap-1 hidden" id="targetWrapper">
                <label class="text-sm text-slate-400">Target Value (for searching)</label>
                <input type="number" id="targetValue" value="22" class="bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <button id="runBtn" class="mt-auto bg-gradient-to-r from-blue-500 to-emerald-500 hover:from-blue-600 hover:to-emerald-600 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-lg shadow-blue-500/20 active:scale-95">
                Execute Algorithm
            </button>
        </section>

        <!-- Output Panel -->
        <section class="glass-panel rounded-2xl p-6 col-span-1 md:col-span-2 flex flex-col shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Execution Results</h2>
                <span id="timeMetric" class="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full text-emerald-400 border border-emerald-900 hidden">0.00 ms</span>
            </div>
            
            <div id="outputConsole" class="flex-1 bg-[#0a0f1a] rounded-xl border border-slate-800 p-4 font-mono text-sm text-slate-300 overflow-y-auto min-h-[300px]">
                <span class="text-slate-500">> System Ready. Select an algorithm and press Execute.</span><br>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
